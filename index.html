<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑站游戏即时计分</title>

    <style>
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
        }

        .team-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .team-name {
            font-size: 24px;
            font-weight: bold;
        }

        .score {
            font-size: 35px;
            margin: 15px;
            color: #333;
        }

        button {
            width: 45%;
            height: 70px;
            font-size: 25px;
            border-radius: 15px;
            border: none;
            margin: 5px;
            cursor: pointer;
        }

        .plus {
            background: #4CAF50;
            color: white;
        }

        .minus {
            background: #f44336;
            color: white;
        }

    </style>
</head>


<body>

<h1>🏃 跑站游戏即时计分</h1>


<div class="team-card">

    <div class="team-name">
        第一组
    </div>

    <div class="score">
        0 分
    </div>

    <button class="plus">
        +5
    </button>

    <button class="minus">
        -5
    </button>

</div>



<div class="team-card">

    <div class="team-name">
        第二组
    </div>

    <div class="score">
        0 分
    </div>

    <button class="plus">
        +5
    </button>

    <button class="minus">
        -5
    </button>

</div>



<div class="team-card">

    <div class="team-name">
        第三组
    </div>

    <div class="score">
        0 分
    </div>

    <button class="plus">
        +5
    </button>

    <button class="minus">
        -5
    </button>

</div>


<script src="script.js"></script>

</body>
</html>
